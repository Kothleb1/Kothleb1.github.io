      <h1>Решение большой вложенности</h1>
      <p>Настройка воронки продаж на all-in-one платформе стала быстрее на 21%. Продукт: System.io, конструктор сайтов и воронок для малого и среднего бизнеса. Роль: продуктовый дизайнер.</p>
      <p>Контекст. Панель управления воронками продаж, вкладка Configuration: пользователь настраивает продукт, цену, скидки и купоны для этапа воронки.</p>
      <p>Проблема. Интерфейс не отвечал потребностям аудитории, которой нужно быстро настроить и запустить продажи. Обязательные и опциональные поля перемешаны — пользователи ошибались и тратили время на расшифровку. Контекстная разорванность: чтобы создать новый продукт, приходилось покидать экран и уходить в другой раздел. Визуальный шум: пять primary-кнопок разных уровней в одной панели.</p>
      <p>Влияние на бизнес: падение доли успешно завершённых конфигураций, рост Time-to-Value, рост нагрузки на поддержку.</p>
      <p>Метрики. Без доступа к боевой аналитике на старте выбраны прокси-метрики, измеримые в UX-тестах: Time-to-task на ключевых сценариях (создание продукта, добавление скидки, купона, предпросмотр) и Error Rate — критические ошибки, переспросы, зависания. Критерий успеха: сокращение времени на ключевые сценарии более чем на 15% как основание для запуска A/B-теста на реальном трафике.</p>
      <p>Результаты. Время настройки сократилось на 19–23% по данным юзабилити-тестов, n=5. Критические ошибки при первом использовании — 0, тогда как в текущей версии с ними сталкивались 4 пользователя из 5. Следующий шаг — валидация в A/B-тесте и замер бизнес-метрик.</p>
      <p>Анализ конкурентов. Разобраны Notion и edtech-платформы Learnybox, Gurucan, Podia — конструкторы курсов и воронок, где та же задача сложной настройки решена по-своему. Смотрел не на визуал, а на то, почему их решения работают. Из Notion взят принцип документа: фиксированная ширина и крупные заголовки как визуальные якоря против слепого скролла. Из Learnybox — тоглы с раскрывающимися полями для дополнительных функций: новый пользователь не пугается сложности, опытный знает, где включить нужное. Из Gurucan и Podia — разделение левой навигации и рабочей области: слева структура воронки, справа настройка конкретного этапа.</p>
      <p>Гипотезы. Разделение первичных и вторичных действий: первичные постоянно видимы, вторичные — в управляемых переключателях с иконкой информации. Перенос добавления купонов и товаров в отдельный шаг.</p>
      <p>Методы: анализ текущего интерфейса, user flow, конкурентный анализ edtech- и SaaS-платформ, гипотезы, прототипирование, юзабилити-тестирование, прокси-метрики Time-to-task и Error Rate, подготовка решения к A/B-тесту.</p>
