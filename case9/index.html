      <h1>Techkot: независимый выбор смартфона</h1>
      <p>Techkot: независимый сервис выбора смартфона. Человек отвечает на три вопроса о своих задачах и получает три модели: почему каждая подходит, её слабое место и проверенная цена конкретной конфигурации. Купить можно на любой площадке. MVP: смартфоны до 30 000 и до 25 000 ₽, проект готовится к релизу. Роль: продуктовый дизайнер, один на проекте. Ресёрч, PRD, дизайн-система и интерфейс; фронтенд и сбор данных вместе с AI-агентами.</p>
      <p>Проблема. Человек знает сумму, но не знает модель. Топы противоречат друг другу, больше половины из них делают магазины и операторы связи, части моделей нет в продаже, ИИ-ассистенты ошибаются или советуют только свою витрину, видеообзоры длинные и с рекламой.</p>
      <p>Исследование. Яндекс Вордстат: 3 950 запросов, в сегменте от 25 до 30 тысяч рублей 360 526 показов; слово «подбор» почти не ищут, 12 130 показов против 3 068 844 у «лучших». Пять подборок по одному запросу назвали 35 моделей, общих ни одной. Опрос и 5 интервью с людьми от 30 до 65 лет, разбор конкурентов.</p>
      <p>Гипотезы. Если сжать информацию до сути, человек примет решение у нас. Цена конкретной конфигурации с датой, источник у каждого утверждения и открытая модель заработка возвращают доверие.</p>
      <p>Решение. Анкета из трёх вопросов, топ-3 с доказательством, окно «Где купить» с ценами Wildberries, Ozon и Яндекс Маркета, шесть готовых подборок. Каталог 66 моделей, характеристики сверяются по трём источникам, расчёт повторяемый. Своя дизайн-система.</p>
      <p>Метрики после релиза: переход к покупке как главная, доходимость до топ-3, доля успешных сценариев в юзабилити-тесте. Валидация: юзабилити-тест MVP.</p>
      <p>Методы: JTBD, анализ спроса, конкурентный анализ, опрос, интервью, гипотезы, PRD, дизайн-система, прототипирование, продуктовые метрики.</p>
