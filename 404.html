      <h1>Тимофей Прончатов</h1>
      <p>Продуктовый дизайнер: B2B, B2E, SaaS, финтех, e-commerce. Веду продукт целиком — интервью и опросы, гипотезы, сценарии, интерфейс, прототип, юзабилити-тест, метрика. Сильная сторона — сложные рабочие интерфейсы: большие таблицы, глубокая вложенность, многошаговые сценарии, онбординг и регистрация. Довожу дизайн до кода: портфолио написано самостоятельно на React и TypeScript.</p>
      <p>System.io, конструктор сайтов и воронок продаж (B2B SaaS): перепроектировал вкладку настройки этапа воронки. Время настройки сократилось на 19–23% по данным юзабилити-тестов, критические ошибки при первом использовании — 0 против 4 из 5 пользователей в текущей версии.</p>
      <p>Tele2, внутреннее desktop-приложение для инженеров (B2E, task management): производительность сотрудников выросла в 1,5 раза, скорость решения заявок — на 9,82%, количество ошибок снизилось на 15%. Вторая итерация дала ещё −3,33% времени и −10% ошибок.</p>
      <p>RackTables, каталог серверного оборудования (B2B, enterprise): редизайн главной страницы и карточки объекта — навигация и поиск вместо длинного списка, разгруженная карточка объекта.</p>
      <p>Бренд одежды: перевод продаж из ВКонтакте на собственный сайт с объединением билетов и мерча — цели по росту выручки, конверсии и среднему чеку обоснованы отраслевыми бенчмарками.</p>
      <p>Почта Банк: UX-разбор регистрации в мобильном банке — 5 модерируемых юзабилити-тестов, CJM по шести этапам, переработанный флоу.</p>
      <p>Опыт: System.io, Продуктовый дизайнер, ноябрь 2025 — январь 2026; Tele2 Россия, UX/UI designer, апрель 2023 — апрель 2024; Tele2 Россия, Инженер, апрель 2018 — апрель 2024.</p>
      <p>Домены: B2B, B2E, B2C, SaaS, enterprise, внутренние корпоративные системы, телеком, финтех, e-commerce, adtech, edtech-платформы (конкурентный анализ), task management, BPM.</p>
      <p>Навыки: продуктовый дизайн, UX-исследования, глубинные интервью, юзабилити-тестирование, бенчмаркинг, JTBD, Customer Journey Map, user flow, информационная архитектура, прототипирование, MVP, дизайн-системы, Atomic Design, дизайн-токены, адаптивный дизайн, доступность, метрики продукта, Time-to-Value, конверсия, прокси-метрики Time-to-task и Error Rate, подготовка решений к A/B-тестированию, Figma, React, TypeScript, вёрстка, AI-assisted design.</p>
