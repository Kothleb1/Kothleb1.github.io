      <h1>От VK к бренд-сайту</h1>
      <p>Воронка продажи билетов и мерча: переход бренда из ВКонтакте на собственный сайт. Роль: продуктовый дизайнер.</p>
      <p>Идея. Собственный лендинг и мерч-шоп для российской альтернативной рок-группы дают контроль над каналом продаж, объединяют билеты и мерч (рост среднего чека) и снимают зависимость от ВК, где не хватает аналитики и e-commerce-инструментов.</p>
      <p>Обоснование на данных. Продажи через сообщество ВК ограничены: узкий каталог, неудобный чек-аут, слабая аналитика. В российском e-commerce доля брошенных корзин — 70–81%. Офлайн-события растут, покупка билетов онлайн даёт точку контакта, где уместно предложить мерч.</p>
      <p>Цели и их обоснование: рост выручки онлайн-канала на 20–25% за первые 12 месяцев; конверсия сайта 3,0% за 6 месяцев при отраслевом бенчмарке fashion e-commerce 2,9–3,3%; снижение брошенных корзин с 75–80% до 55–60%; рост среднего чека на 20% за счёт кросс-продаж билет + мерч; база из 1000 подписчиков за 6 месяцев. Для каждой цели зафиксирован уровень уверенности.</p>
      <p>Целевая аудитория. По данным ВЦИОМ рок слушают около 24% россиян, среди зумеров и младших миллениалов — около 39%, то есть ядро в возрасте 18–35 лет. Подтверждено анализом сообществ во ВКонтакте и Telegram.</p>
      <p>Бенчмаркинг. Разобраны магазины Little Big, Мумий Тролль, LOUNA, IC3PEAK, Lady Gaga по осям: брендинг, ассортимент мерча, продажа билетов, корзина, доставка и оплата, личный кабинет.</p>
      <p>Выводы для архитектуры. Ассортимент: унисекс-футболка, худи, тоут, пин, винил, базовый плюс лимитированные позиции. Доставка: CDEK и Почта России с трекингом в письме. Платежи: локальные шлюзы, СБП, карты, Apple и Google Pay. Билеты: афиша на лендинге с переходом на кассу и опцией пресейла при покупке мерча. Гостевой чек-аут снижает отток корзин на 23–30%, профиль нужен для пресейла и повторных покупок. Ключевой UX-приём — кросс-продажа билетов и мерча.</p>
      <p>Методы: продуктовое обоснование на данных, постановка целей и метрик, бенчмаркинг, проектирование e-commerce-архитектуры, checkout, брендинг, адаптив.</p>
