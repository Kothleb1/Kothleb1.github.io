      <noscript>
      <h1>Трансформация BPM-данных в эффективное приложение</h1>
      <p>Внутреннее desktop-приложение для систематизации работы с заявками и контроля нагрузки команды. Роль: продуктовый дизайнер, полный цикл.</p>
      <p>Контекст. Телеком-компания, подразделение развития и масштабирования сети. Процесс: подрядчик звонит по завершении работ, инженер проверяет заявку в BPM, свободный инженер берёт её в работу.</p>
      <p>Проблема. Возросший объём экстренных заявок, очереди на приёмку, ошибки в работе, усталость от монотонных операций.</p>
      <p>Критерии успеха: систематизация процесса, снижение времени обработки заявки, снижение количества ошибок, рост числа выполненных заявок за смену, снижение когнитивной нагрузки.</p>
      <p>Исследование. Опрос целевой аудитории — 22 инженера с одинаковой должностью и 3 лида. Бенчмаркинг: разбор того, чем задачу закрывают сейчас (BPM как источник данных о заявке — компактная табличная форма, но перегруженная и медленная; Lync как способ распределения заявок — быстрая связь, но флуд и неточные статусы) и что предлагает внешний рынок (Freshdesk, Zendesk, Genesys, Avaya среди прямых конкурентов; Jira, Trello, Toggl Track среди косвенных). Вывод: готовые системы требуют серьёзной доработки логики смен, статусов и распределения заявок. Отличие продукта — одновременно видно, кто на смене, чем занят, какие заявки в очереди и в работе и сколько времени они занимают.</p>
      <p>Проектирование. User flow с целью получить цикличный процесс без corner-кейсов. Вайрфреймы по четырём блокам: контроль состояния сотрудника, поиск заявок, очередь заявок, работа с заявками.</p>
      <p>MVP. Стратегия минимально жизнеспособной разработки на стандартных библиотеках Python — релиз совмещён с тестированием в реальных условиях и мгновенным сбором обратной связи.</p>
      <p>Результаты MVP: процесс систематизирован, решение заявок ускорено на 9,82%, производительность сотрудников выросла в 1,5 раза, количество ошибок снизилось на 15%.</p>
      <p>Вторая итерация. Анализ обратной связи, требования с учётом специфики работы — смена 12 часов, дневные и ночные часы: контрастный текст, палитра, от которой не устают глаза, различимость действий и информации, отсутствие визуальной перегрузки. В прототипе поле «Номер БС» подсказывает саджесты и автозаполняет остальные данные, совмещая поиск и ввод; отдельные кнопки вызывают сторонние скрипты обработки заявки. Результаты: снижение когнитивной нагрузки, расширение функционала, ускорение решения заявок ещё на 3,33%, снижение ошибок ещё на 10%.</p>
      <p>Методы: опрос, бенчмаркинг, user flow, вайрфреймы, MVP, юзабилити-тестирование, анализ обратной связи, метрики.</p>
